# Task 6.6 - VisionGuard CI: lint + tests, then build the Docker image.
# Secrets (e.g. a DagsHub token for future model-download steps) would be stored in
# GitHub -> Settings -> Secrets and variables -> Actions and referenced as ${{ secrets.NAME }};
# they are never written in this file because the workflow file is public in the repository.
name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: pip install -r requirements-ci.txt
      - name: Lint (flake8)
        run: flake8 visionguard webapp api src scripts tests
      - name: Tests (pytest)
        run: pytest -v tests

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -t 23l0839_a2_ops-web:${{ github.sha }} .
      - name: Show image size and non-root user
        run: |
          docker image ls 23l0839_a2_ops-web
          docker run --rm --entrypoint id 23l0839_a2_ops-web:${{ github.sha }}
